name: CI/CD - FIAP X API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RESOURCE_GROUP: rg-fiapx-fx2026
  AKS_NAME: aks-fiapx

jobs:
  build-and-test:
    name: Build e Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  deploy:
    name: Docker e Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Info
        id: acr
        run: |
          ACR_NAME=$(az acr list -g ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "server=$(az acr show -n $ACR_NAME --query loginServer -o tsv)" >> $GITHUB_OUTPUT

      - name: ACR Login
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and Push
        run: |
          docker build -t ${{ steps.acr.outputs.server }}/fiapx-api:${{ github.sha }} -t ${{ steps.acr.outputs.server }}/fiapx-api:latest .
          docker push ${{ steps.acr.outputs.server }}/fiapx-api:${{ github.sha }}
          docker push ${{ steps.acr.outputs.server }}/fiapx-api:latest

      - name: Get AKS Credentials
        run: |
          AKS_NAME=$(az aks list -g ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          az aks get-credentials -g ${{ env.RESOURCE_GROUP }} -n $AKS_NAME --overwrite-existing

      - name: Create Namespace and Secrets
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -
          
          SQL_SERVER=$(az sql server list -g ${{ env.RESOURCE_GROUP }} --query "[0].fullyQualifiedDomainName" -o tsv)
          
          kubectl create secret generic fiapx-secrets -n fiapx \
            --from-literal=SQL_CONNECTION_STRING="Server=tcp:${SQL_SERVER},1433;Database=FiapXDb;User ID=fiapxadmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;" \
            --from-literal=JWT_KEY="${{ secrets.JWT_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy RabbitMQ
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rabbitmq
            namespace: fiapx
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: rabbitmq
            template:
              metadata:
                labels:
                  app: rabbitmq
              spec:
                containers:
                - name: rabbitmq
                  image: rabbitmq:3-management
                  ports:
                  - containerPort: 5672
                  - containerPort: 15672
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: rabbitmq-service
            namespace: fiapx
          spec:
            selector:
              app: rabbitmq
            ports:
            - name: amqp
              port: 5672
            - name: management
              port: 15672
          EOF

      - name: Deploy API
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fiapx-api
            namespace: fiapx
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: fiapx-api
            template:
              metadata:
                labels:
                  app: fiapx-api
              spec:
                containers:
                - name: fiapx-api
                  image: ${{ steps.acr.outputs.server }}/fiapx-api:${{ github.sha }}
                  ports:
                  - containerPort: 80
                  env:
                  - name: ASPNETCORE_ENVIRONMENT
                    value: "Production"
                  - name: ASPNETCORE_URLS
                    value: "http://+:80"
                  - name: ConnectionStrings__DefaultConnection
                    valueFrom:
                      secretKeyRef:
                        name: fiapx-secrets
                        key: SQL_CONNECTION_STRING
                  - name: RabbitMQ__HostName
                    value: "rabbitmq-service"
                  - name: RabbitMQ__UserName
                    value: "guest"
                  - name: RabbitMQ__Password
                    value: "guest"
                  - name: Jwt__Key
                    valueFrom:
                      secretKeyRef:
                        name: fiapx-secrets
                        key: JWT_KEY
                  - name: Jwt__Issuer
                    value: "FiapX"
                  - name: Jwt__Audience
                    value: "FiapX.Users"
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 80
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 80
                    initialDelaySeconds: 30
                    periodSeconds: 10
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: fiapx-api-service
            namespace: fiapx
          spec:
            type: LoadBalancer
            selector:
              app: fiapx-api
            ports:
            - port: 80
              targetPort: 80
          EOF
          
          kubectl rollout status deployment/fiapx-api -n fiapx --timeout=300s

      - name: Get API URL
        run: |
          echo "Aguardando IP externo..."
          for i in {1..30}; do
            IP=$(kubectl get svc fiapx-api-service -n fiapx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "## 🌐 API Disponível!" >> $GITHUB_STEP_SUMMARY
              echo "URL: http://$IP" >> $GITHUB_STEP_SUMMARY
              echo "Swagger: http://$IP/swagger" >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 10
          done