global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitora a si mesmo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FIAP X API
  - job_name: 'fiapx-api'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: /metrics
    scheme: http
