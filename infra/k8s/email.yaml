apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-email
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiapx-email
  template:
    metadata:
      labels:
        app: fiapx-email
    spec:
      containers:
      - name: fiapx-email
        image: fiapxacr.azurecr.io/fiapx-email:latest
        env:
        - name: RabbitMQ__HostName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_HOST
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_PASSWORD
        - name: Email__Enabled
          value: "false"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
