apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-api
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiapx-api
  template:
    metadata:
      labels:
        app: fiapx-api
    spec:
      containers:
      - name: fiapx-api
        image: fiapxacr.azurecr.io/fiapx-api:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:80"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: SQL_CONNECTION_STRING
        - name: RabbitMQ__HostName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_HOST
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_PASSWORD
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          value: "FiapX"
        - name: Jwt__Audience
          value: "FiapX.Users"
        - name: Storage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: STORAGE_CONNECTION_STRING
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fiapx-api-service
  namespace: fiapx
spec:
  type: LoadBalancer
  selector:
    app: fiapx-api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiapx-api-hpa
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiapx-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
