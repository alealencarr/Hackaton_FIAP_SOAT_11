apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-worker
  namespace: fiapx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fiapx-worker
  template:
    metadata:
      labels:
        app: fiapx-worker
    spec:
      containers:
      - name: fiapx-worker
        image: fiapxacr.azurecr.io/fiapx-worker:latest
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: SQL_CONNECTION_STRING
        - name: RabbitMQ__HostName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_HOST
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBITMQ_PASSWORD
        - name: Storage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: STORAGE_CONNECTION_STRING
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiapx-worker-hpa
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiapx-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
